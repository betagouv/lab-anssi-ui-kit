name: "Storybook Tests"
permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "outils/**"
      - "scripts/**"
      - "vite.config.ts"
      - "vite.webcomponents.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "outils/**"
      - "scripts/**"
      - "vite.config.ts"
      - "vite.webcomponents.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Utiliser la version Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Installe pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Playwright
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Construit le Storybook
        run: pnpm run storybook:build

      - name: Sers le Storybook et lance les tests
        run: |
          ./node_modules/.bin/concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "./node_modules/.bin/http-server storybook-static --port 6006 --silent" \
            "./node_modules/.bin/wait-on tcp:127.0.0.1:6006 && pnpm run storybook:test"
