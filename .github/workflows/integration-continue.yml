name: L'intégration continue
permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "outils/**"
      - "scripts/**"
      - "vite.config.ts"
      - "vite.webcomponents.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.check.json"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "outils/**"
      - "scripts/**"
      - "vite.config.ts"
      - "vite.webcomponents.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.check.json"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/**"

jobs:
  build:
    name: Construction de Lab. ANSSI - UI Kit

    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer les dépendances pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          node-version-file: ".nvmrc"

      - name: Installer Playwright
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Exécuter les tests
        run: pnpm run test

      - name: Contrôler le linting
        run: pnpm run lint

      - name: Contrôler les types Svelte et TypeScript
        run: pnpm run check

      - name: Contrôler le format
        run: pnpm run format:check

      - name: Construit le Storybook
        run: pnpm run storybook:build

      - name: Builder le package
        run: pnpm run build
