# _c.f._ https://pnpm.io/settings

minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
preferFrozenLockfile: true

overrides:
  rollup: ">=4.30.0"
  flatted: ">=3.4.2"
  lodash: ">=4.18.0"
  minimatch: ">=10.2.3"
  picomatch: ">=4.0.4"
  axios: ">=1.15.2"
  follow-redirects: ">=1.16.0"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23
