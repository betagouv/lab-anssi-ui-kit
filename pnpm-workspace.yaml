minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
preferFrozenLockfile: true

overrides:
  rollup: ">=4.66.0"
  flatted: ">=3.4.4"
  lodash: ">=4.18.0"
  minimatch: ">=11.0.4"
  picomatch: ">=4.0.7"
  axios: ">=1.20.0"
  follow-redirects: ">=1.16.2"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23
  # Renovate security update: minimatch@11.0.4
  - minimatch@11.0.4
